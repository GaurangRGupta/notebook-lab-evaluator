# ======================================================================
# WEEK 3 SYNTHETIC DEVELOPMENT CONFIG. Uses team-authored fixtures + SIMULATED labels.
# Synthetic development run: results are not evidence of real student performance.
# Results produced with this config are NOT evidence of real-world performance.
# ======================================================================
data_status: SYNTHETIC_DEVELOPMENT_DATA
data_dir: data/synthetic
interim_dir: data/synthetic/interim        # anonymised copies
results_dir: results/synthetic_dev_week3
manifest: manifest.csv                     # raw_path, assignment_id, group_key, source, license
references_dir: references                 # <ASSIGNMENT_ID>/{template,reference_solution}.ipynb + json
annotations:
  raw: annotations/raw_annotations.csv     # raw_path, annotator, code, explanation, documentation
  adjudicated: annotations/adjudicated.csv # optional: post-discussion labels for flagged items
  discussion_tolerance: 1                  # annotator range > 1 mark -> discuss
anonymisation:
  salt: SYNTHETIC-DEV-SALT-NOT-SECRET      # real data: load from an env var / file outside the repo
  roll_pattern: '\b[A-Z]\d{3}\b'
  class_list: class_list.txt
rubric_max: {code: 8, explanation: 8, documentation: 4}
preprocessing:
  template_similarity_threshold: 0.9
split:
  target: [0.6, 0.2, 0.2]                  # approximate; whole groups are assigned
  seed: 42
  near_duplicate_threshold: 0.95
model:
  alpha_grid: [0.1, 1.0, 10.0]
  evaluate_test: true                      # frozen variants scored once on test
  variants: [week2_tfidf, week3_semantic, week3_combined]   # see src/models/features.py
  primary_variant: week3_combined          # Version 1 model used for per-notebook reports
  grouped_cv: true                         # leave-one-group-out on TRAIN+VAL only (test untouched)
  cv_alpha: 1.0
semantic:
  enabled: true
  encoder: sentence-transformers           # 'stub' = lexical test stand-in, NEVER report as semantic
  model_name: sentence-transformers/all-MiniLM-L6-v2
  revision: null                           # pin a commit hash once downloaded; resolved hash is logged
  local_path: null                         # or a folder containing a saved copy of the model (offline)
  device: cpu
  batch_size: 32
  seed: 42
  concept_threshold: calibrate             # chosen on week3/concept_pairs.csv tune split only
  calibration_pairs: week3/concept_pairs.csv
  probes: week3/probes.json                # error-analysis probe pairs
features: null                             # null -> defaults in src/models/features.py
