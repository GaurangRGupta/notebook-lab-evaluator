[project]
name = "speech-and-natural-language-processing-project"
version = "0.1.0"
description = "Jupyter notebook lab evaluator. Scores a notebook from saved output and the write-up."
readme = "README.md"
authors = [
    { name = "Gaurang Gupta", email = "gaurangrgupta@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6",
    "pytest>=8",
    "sentence-transformers>=4.0",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "openai>=1.40",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
